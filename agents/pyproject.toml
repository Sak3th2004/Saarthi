[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saarthi-agents"
version = "0.1.0"
description = "Bounded Strands routing for Saarthi care coordination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["strands-agents>=1.55.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/saarthi_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
