name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c constraints.txt mcp
      - run: python -m pip install -c constraints.txt -e ./agents -e './mcp-server[dev,agents,calendar]'
      - run: python scripts/check.py --neo4j
  release-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker build -f mcp-server/Dockerfile -t saarthi-release:local .
      - run: python scripts/smoke_container.py
      - name: Export verified release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save saarthi-release:local | gzip > "$RUNNER_TEMP/saarthi-release.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: saarthi-release-${{ github.sha }}
          path: ${{ runner.temp }}/saarthi-release.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
