name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c constraints.txt mcp
      - run: python -m pip install -c constraints.txt -e ./agents -e './mcp-server[dev,agents,calendar]'
      - run: python scripts/check.py --neo4j
  release-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker build -f mcp-server/Dockerfile -t saarthi-release:local .
      - run: python scripts/smoke_container.py
      - name: Export verified release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save saarthi-release:local | gzip > "$RUNNER_TEMP/saarthi-release.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: saarthi-release-${{ github.sha }}
          path: ${{ runner.temp }}/saarthi-release.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Sak3th2004/Saarthi'
    needs: [backend, dashboard, release-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saarthi-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - run: docker load -i "$RUNNER_TEMP/release/saarthi-release.tar.gz"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011528303937:role/saarthi-github-release
          aws-region: us-east-1
          role-session-name: SaarthiRelease
      - name: Publish immutable tested image
        env:
          REGISTRY: 011528303937.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag saarthi-release:local "$REGISTRY/saarthi-notebook:$IMAGE_TAG"
          docker push "$REGISTRY/saarthi-notebook:$IMAGE_TAG"
